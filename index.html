<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Schön! | Official Online Store</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Noto+Serif+JP:wght@300;400;500&display=swap');

    :root {
      --bg: #F8F6F2;
      --card-bg: #FFFFFF;
      --text: #2B2825;
      --text-sub: #78736E;
      --accent: #8C7355;
      --accent-light: #BCAAA4;
      --accent-dark: #5F4C36;
      --border: #E8E4DF;
      --border-dark: #2B2825;
      --price-color: #7A5C3E;
      --font-en: 'Cormorant Garamond', serif;
      --font-ja: 'Noto Serif JP', '游明朝', 'Yu Mincho', serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      background-color: var(--bg); color: var(--text);
      font-family: var(--font-ja); font-size: 14px; line-height: 1.8;
      letter-spacing: 0.05em; -webkit-font-smoothing: antialiased;
    }

    header {
      position: fixed; top: 0; left: 0; right: 0; height: 72px;
      display: flex; justify-content: space-between; align-items: center;
      padding: 0 48px; background: rgba(248, 246, 242, 0.92);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      z-index: 100; border-bottom: 1px solid rgba(232, 228, 223, 0.7);
    }
    .brand-logo {
      font-family: var(--font-en); font-size: 28px; font-weight: 400;
      letter-spacing: 0.15em; color: var(--text); text-decoration: none;
      font-style: italic;
    }
    .nav-links { display: flex; align-items: center; gap: 32px; }
    .nav-link {
      font-family: var(--font-en); font-size: 13px; letter-spacing: 0.2em;
      text-transform: uppercase; color: var(--text-sub); text-decoration: none;
      transition: color 0.3s;
    }
    .nav-link:hover { color: var(--accent); }
    .cart-trigger {
      background: none; border: none; cursor: pointer;
      font-family: var(--font-en); font-size: 13px; letter-spacing: 0.2em;
      text-transform: uppercase; color: var(--text); display: flex;
      align-items: center; gap: 8px; padding: 6px 0; position: relative;
    }
    .cart-badge {
      background: var(--accent); color: white; border-radius: 50%;
      width: 18px; height: 18px; font-size: 10px; font-family: var(--font-en);
      display: flex; align-items: center; justify-content: center;
    }

    .hero {
      padding: 160px 48px 96px; text-align: center;
      background: radial-gradient(circle at 50% 30%, #FFFFFF 0%, var(--bg) 70%);
      border-bottom: 1px solid var(--border);
    }
    .hero-subtitle {
      font-family: var(--font-en); font-size: 12px; letter-spacing: 0.35em;
      text-transform: uppercase; color: var(--accent); margin-bottom: 16px;
    }
    .hero-title {
      font-family: var(--font-en); font-size: 56px; font-weight: 300;
      letter-spacing: 0.08em; line-height: 1.2; margin-bottom: 20px;
    }
    .hero-desc {
      font-size: 13px; color: var(--text-sub); max-width: 480px;
      margin: 0 auto; line-height: 2; font-weight: 300;
    }

    .catalog { max-width: 1280px; margin: 0 auto; padding: 80px 48px 120px; }
    .section-header {
      display: flex; justify-content: space-between; align-items: flex-end;
      margin-bottom: 48px; border-bottom: 1px solid var(--border); padding-bottom: 16px;
    }
    .section-title { font-family: var(--font-en); font-size: 24px; font-weight: 400; letter-spacing: 0.15em; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 48px 32px; }
    .product-card {
      cursor: pointer; group: true; display: flex; flex-direction: column;
    }
    .img-wrap {
      width: 100%; aspect-ratio: 3/4; background-color: #EFECE6;
      overflow: hidden; margin-bottom: 20px; position: relative;
    }
    .img-placeholder {
      width: 100%; height: 100%; display: flex; align-items: center;
      justify-content: center; font-family: var(--font-en); color: var(--accent-light);
      font-size: 12px; letter-spacing: 0.2em; transition: transform 0.6s ease;
    }
    .product-card:hover .img-placeholder { transform: scale(1.04); }
    .product-meta { display: flex; justify-content: space-between; align-items: flex-start; }
    .product-name { font-size: 14px; font-weight: 400; color: var(--text); margin-bottom: 4px; }
    .product-cat { font-family: var(--font-en); font-size: 11px; color: var(--text-sub); letter-spacing: 0.15em; }
    .product-price { font-family: var(--font-en); font-size: 15px; color: var(--price-color); }

    /* サイドバーカート */
    .cart-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.3);
      backdrop-filter: blur(4px); opacity: 0; pointer-events: none;
      transition: opacity 0.4s ease; z-index: 200;
    }
    .cart-overlay.active { opacity: 1; pointer-events: auto; }
    .cart-drawer {
      position: fixed; top: 0; right: 0; bottom: 0; width: 420px; max-width: 100vw;
      background: var(--card-bg); z-index: 201; transform: translateX(100%);
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex; flex-direction: column; padding: 40px;
    }
    .cart-drawer.active { transform: translateX(0); }
    .cart-head {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 32px; border-bottom: 1px solid var(--border); padding-bottom: 16px;
    }
    .cart-title { font-family: var(--font-en); font-size: 20px; font-weight: 400; letter-spacing: 0.15em; }
    .close-btn { background: none; border: none; font-size: 20px; cursor: pointer; color: var(--text-sub); }
    .cart-body { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; }
    .cart-item { display: flex; gap: 16px; border-bottom: 1px solid var(--border); padding-bottom: 16px; }
    .cart-item-info { flex: 1; }
    .cart-item-title { font-size: 13px; font-weight: 500; }
    .cart-item-price { font-family: var(--font-en); color: var(--price-color); font-size: 13px; }
    .cart-item-qty { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
    .qty-btn { background: var(--bg); border: 1px solid var(--border); width: 22px; height: 22px; cursor: pointer; }

    /* クーポン入力欄 */
    .coupon-section { margin-top: 16px; padding-top: 16px; border-top: 1px dashed var(--border); }
    .coupon-label { font-size: 11px; letter-spacing: 0.1em; color: var(--text-sub); text-transform: uppercase; font-family: var(--font-en); }
    .coupon-input-group { display: flex; gap: 8px; margin-top: 6px; }
    .coupon-input {
      flex: 1; padding: 8px 12px; border: 1px solid var(--border);
      background: var(--bg); font-family: var(--font-en); font-size: 13px; text-transform: uppercase;
    }
    .coupon-btn {
      padding: 8px 16px; background: var(--text); color: white; border: none;
      font-family: var(--font-en); font-size: 11px; letter-spacing: 0.1em; cursor: pointer;
    }
    .coupon-msg { font-size: 11px; margin-top: 6px; }
    .coupon-msg.success { color: #4A6B4E; }
    .coupon-msg.error { color: #9E3D3D; }

    .cart-foot { border-top: 1px solid var(--border); padding-top: 24px; margin-top: 16px; }
    .summary-row { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-sub); margin-bottom: 6px; }
    .summary-row.total { font-size: 16px; font-weight: 500; color: var(--text); border-top: 1px solid var(--border); padding-top: 12px; margin-top: 8px; }
    .checkout-btn {
      width: 100%; padding: 16px; background: var(--text); color: white; border: none;
      font-family: var(--font-en); font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase;
      cursor: pointer; transition: background 0.3s; margin-top: 20px;
    }
    .checkout-btn:hover { background: var(--accent); }

    /* 商品詳細 Modal */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.4);
      backdrop-filter: blur(6px); opacity: 0; pointer-events: none;
      transition: opacity 0.3s; z-index: 300; display: flex; align-items: center; justify-content: center;
    }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }
    .modal-card {
      background: var(--card-bg); width: 800px; max-width: 90vw;
      display: flex; border: 1px solid var(--border); position: relative;
    }
    .modal-img { width: 50%; aspect-ratio: 3/4; background: #EFECE6; display: flex; align-items: center; justify-content: center; font-family: var(--font-en); color: var(--accent-light); }
    .modal-content { width: 50%; padding: 48px; display: flex; flex-direction: column; }
    .modal-close { position: absolute; top: 16px; right: 20px; background: none; border: none; font-size: 20px; cursor: pointer; }
    .add-cart-btn {
      margin-top: auto; width: 100%; padding: 14px; background: var(--text);
      color: white; border: none; font-family: var(--font-en); font-size: 12px;
      letter-spacing: 0.2em; text-transform: uppercase; cursor: pointer;
    }
    .add-cart-btn:hover { background: var(--accent); }
  </style>
</head>
<body>

  <header>
    <a href="#" class="brand-logo">Schön!</a>
    <div class="nav-links">
      <a href="#catalog" class="nav-link">Collection</a>
      <a href="https://instagram.com" target="_blank" class="nav-link">Instagram</a>
      <button class="cart-trigger" id="open-cart">
        Cart <span class="cart-badge" id="cart-count">0</span>
      </button>
    </div>
  </header>

  <section class="hero">
    <div class="hero-subtitle">Official Online Store</div>
    <h1 class="hero-title">Schön!</h1>
    <p class="hero-desc">着るだけで、ちょっといい感じ。</p>
  </section>

  <main class="catalog" id="catalog">
    <div class="section-header">
      <h2 class="section-title">2026 Collection</h2>
    </div>
    <div class="grid" id="product-grid"></div>
  </main>

  <!-- カートモーダル -->
  <div class="cart-overlay" id="cart-overlay"></div>
  <div class="cart-drawer" id="cart-drawer">
    <div class="cart-head">
      <h3 class="cart-title">Your Shopping Bag</h3>
      <button class="close-btn" id="close-cart">✕</button>
    </div>
    <div class="cart-body" id="cart-items"></div>

    <div class="coupon-section">
      <div class="coupon-label">Coupon Code</div>
      <div class="coupon-input-group">
        <input type="text" id="coupon-code" class="coupon-input" placeholder="shinshin77">
        <button class="coupon-btn" onclick="applyCoupon()">Apply</button>
      </div>
      <div class="coupon-msg" id="coupon-msg"></div>
    </div>

    <div class="cart-foot">
      <div class="summary-row">
        <span>Subtotal</span>
        <span id="subtotal">¥0</span>
      </div>
      <div class="summary-row">
        <span>Shipping</span>
        <span id="shipping">¥800</span>
      </div>
      <div class="summary-row total">
        <span>Total</span>
        <span id="total">¥0</span>
      </div>
      <button class="checkout-btn" id="checkout-btn">Proceed to Checkout</button>
    </div>
  </div>

  <!-- 商品詳細 Modal -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal-card">
      <button class="modal-close" id="close-modal">✕</button>
      <div class="modal-img" id="modal-img-text">SCHÖN!</div>
      <div class="modal-content">
        <h3 id="modal-title" style="font-size: 20px; font-weight: 400; margin-bottom: 8px;"></h3>
        <p id="modal-price" style="font-family: var(--font-en); color: var(--price-color); font-size: 18px; margin-bottom: 16px;"></p>
        <p id="modal-desc" style="font-size: 13px; color: var(--text-sub); line-height: 1.8; margin-bottom: 24px;"></p>
        <button class="add-cart-btn" id="modal-add-btn">Add to Cart</button>
      </div>
    </div>
  </div>

  <script>
    const products = [
      { id: 1, name: 'Minimalist Wool Coat', category: 'Outerwear', price: 24000, desc: '上質なウールを使用したミニマルなリラックスシルエットコート。' },
      { id: 2, name: 'Silk Linen Shirt', category: 'Tops', price: 12800, desc: 'シルクの上品な光沢感とリネンの清涼感を併せ持ったシャツ。' },
      { id: 3, name: 'Tailored Wide Trousers', category: 'Bottoms', price: 16500, desc: '美しいドレープ感が特徴のワイドスラックス。' },
      { id: 4, name: 'Cashmere Blend Knit', category: 'Knitwear', price: 18000, desc: '肌触りの良いカシミヤ混のベーシックニット。' }
    ];

    let cart = [];
    let appliedCoupon = null;
    const DEFAULT_SHIPPING = 800;
    let currentShipping = DEFAULT_SHIPPING;
    let selectedProduct = null;

    // 商品一覧レンダリング
    const grid = document.getElementById('product-grid');
    products.forEach(p => {
      grid.innerHTML += `
        <div class="product-card" onclick="openProductModal(${p.id})">
          <div class="img-wrap"><div class="img-placeholder">SCHÖN!</div></div>
          <div class="product-meta">
            <div>
              <div class="product-name">${p.name}</div>
              <div class="product-cat">${p.category}</div>
            </div>
            <div class="product-price">¥${p.price.toLocaleString()}</div>
          </div>
        </div>
      `;
    });

    // 商品詳細 Modal
    function openProductModal(id) {
      selectedProduct = products.find(p => p.id === id);
      document.getElementById('modal-title').textContent = selectedProduct.name;
      document.getElementById('modal-price').textContent = `¥${selectedProduct.price.toLocaleString()}`;
      document.getElementById('modal-desc').textContent = selectedProduct.desc;
      document.getElementById('modal-overlay').classList.add('active');
    }

    document.getElementById('close-modal').onclick = () => document.getElementById('modal-overlay').classList.remove('active');
    document.getElementById('modal-add-btn').onclick = () => {
      if (selectedProduct) {
        addToCart(selectedProduct);
        document.getElementById('modal-overlay').classList.remove('active');
      }
    };

    function addToCart(product) {
      const existing = cart.find(i => i.id === product.id);
      if (existing) {
        existing.qty++;
      } else {
        cart.push({ ...product, qty: 1 });
      }
      updateCartUI();
      openCartDrawer();
    }

    function changeQty(id, delta) {
      const item = cart.find(i => i.id === id);
      if (!item) return;
      item.qty += delta;
      if (item.qty <= 0) {
        cart = cart.filter(i => i.id !== id);
      }
      updateCartUI();
    }

    function applyCoupon() {
      const code = document.getElementById('coupon-code').value.trim();
      const msg = document.getElementById('coupon-msg');
      if (code === 'shinshin77') {
        appliedCoupon = 'shinshin77';
        currentShipping = 0;
        msg.className = 'coupon-msg success';
        msg.textContent = 'Coupon "shinshin77" applied (Free Shipping)';
      } else {
        appliedCoupon = null;
        currentShipping = DEFAULT_SHIPPING;
        msg.className = 'coupon-msg error';
        msg.textContent = 'Invalid coupon code';
      }
      updateCartUI();
    }

    function updateCartUI() {
      const itemsEl = document.getElementById('cart-items');
      itemsEl.innerHTML = '';
      let subtotal = 0;
      let count = 0;

      cart.forEach(item => {
        subtotal += item.price * item.qty;
        count += item.qty;
        itemsEl.innerHTML += `
          <div class="cart-item">
            <div class="cart-item-info">
              <div class="cart-item-title">${item.name}</div>
              <div class="cart-item-price">¥${item.price.toLocaleString()}</div>
              <div class="cart-item-qty">
                <button class="qty-btn" onclick="changeQty(${item.id}, -1)">-</button>
                <span>${item.qty}</span>
                <button class="qty-btn" onclick="changeQty(${item.id}, 1)">+</button>
              </div>
            </div>
            <div>¥${(item.price * item.qty).toLocaleString()}</div>
          </div>
        `;
      });

      document.getElementById('cart-count').textContent = count;
      document.getElementById('subtotal').textContent = `¥${subtotal.toLocaleString()}`;

      if (cart.length === 0) {
        document.getElementById('shipping').textContent = '¥0';
        document.getElementById('total').textContent = '¥0';
      } else {
        document.getElementById('shipping').textContent = currentShipping === 0 ? 'FREE' : `¥${currentShipping.toLocaleString()}`;
        document.getElementById('total').textContent = `¥${(subtotal + (cart.length > 0 ? currentShipping : 0)).toLocaleString()}`;
      }
    }

    function openCartDrawer() {
      document.getElementById('cart-overlay').classList.add('active');
      document.getElementById('cart-drawer').classList.add('active');
    }
    function closeCartDrawer() {
      document.getElementById('cart-overlay').classList.remove('active');
      document.getElementById('cart-drawer').classList.remove('active');
    }

    document.getElementById('open-cart').onclick = openCartDrawer;
    document.getElementById('close-cart').onclick = closeCartDrawer;
    document.getElementById('cart-overlay').onclick = closeCartDrawer;

    // 決済リクエスト
    document.getElementById('checkout-btn').onclick = async () => {
      if (cart.length === 0) return alert('カートに商品が入っていません。');

      try {
        const res = await fetch('/create-checkout-session', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ cart, couponCode: appliedCoupon })
        });
        const data = await res.json();
        if (data.url) {
          window.location.href = data.url;
        } else {
          alert('決済セッションの作成に失敗しました。');
        }
      } catch (err) {
        console.error(err);
        alert('エラーが発生しました。');
      }
    };
  </script>
</body>
</html>
